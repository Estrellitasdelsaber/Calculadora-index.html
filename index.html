<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calc</title>
<style>
body{margin:0;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;font-family:Arial}
.calc{background:#222;padding:20px;border-radius:20px;width:300px}
#d{width:100%;height:60px;font-size:32px;text-align:right;border:none;background:#333;color:#fff;border-radius:10px;padding:10px;margin-bottom:10px;box-sizing:border-box}
.b{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{height:60px;font-size:22px;border:none;border-radius:10px;background:#444;color:#fff;cursor:pointer}
button:active{background:#666}
.o{background:orange}
.e{background:green;grid-column:span 2}
.c{background:red}
.z{grid-column:span 2}
</style>
</head>
<body>
<div class="calc">
<input id="d" readonly>
<div class="b">
<button class="c" onclick="d.value=''">C</button>
<button onclick="d.value=d.value.slice(0,-1)">⌫</button>
<button onclick="d.value+='%'">%</button>
<button class="o" onclick="d.value+='/'">÷</button>
<button onclick="d.value+='7'">7</button>
<button onclick="d.value+='8'">8</button>
<button onclick="d.value+='9'">9</button>
<button class="o" onclick="d.value+='*'">×</button>
<button onclick="d.value+='4'">4</button>
<button onclick="d.value+='5'">5</button>
<button onclick="d.value+='6'">6</button>
<button class="o" onclick="d.value+='-'">-</button>
<button onclick="d.value+='1'">1</button>
<button onclick="d.value+='2'">2</button>
<button onclick="d.value+='3'">3</button>
<button class="o" onclick="d.value+='+'">+</button>
<button class="z" onclick="d.value+='0'">0</button>
<button onclick="d.value+='.'">.</button>
<button class="e" onclick="try{d.value=eval(d.value)}catch{d.value='Error'}">=</button>
</div>
</div>
</body>
</html>
