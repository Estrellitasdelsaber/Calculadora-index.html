<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Calc Pro 2026</title>
<style>
:root{--bg:#0a0a0f;--calc:#14141f;--btn:#252538;--btn2:#ff7b00;--btn3:#00d4ff;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.calc{background:var(--calc);border-radius:35px;padding:30px 20px;width:100%;max-width:380px;box-shadow:0 25px 80px rgba(0,0,0,0.6)}
.hist{height:30px;font-size:16px;color:#666;text-align:right;margin-bottom:5px;overflow:hidden}
.display{height:100px;font-size:48px;color:var(--text);text-align:right;display:flex;align-items:flex-end;justify-content:flex-end;padding:0 10px;margin-bottom:25px;word-wrap:break-word;overflow-wrap:break-word}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.btn{height:70px;border:none;border-radius:20px;font-size:26px;background:var(--btn);color:var(--text);cursor:pointer;transition:all 0.15s;font-weight:500}
.btn:active{transform:scale(0.92);filter:brightness(1.3)}
.op{background:var(--btn2);color:#000;font-weight:700}
.func{background:var(--btn3);color:#000;font-weight:700}
.zero{grid-column:span 2}
.eq{background:#00ff88;color:#000;font-weight:700;grid-column:span 2}
@media(max-width:400px){.btn{height:65px;font-size:24px}.display{font-size:42px}}
</style>
</head>
<body>
<div class="calc">
  <div class="hist" id="hist"></div>
  <div class="display" id="disp">0</div>
  <div class="grid">
    <button class="btn func" onclick="clearAll()">AC</button>
    <button class="btn func" onclick="backspace()">⌫</button>
    <button class="btn func" onclick="add('%')">%</button>
    <button class="btn op" onclick="add('/')">÷</button>
