<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora Completa</title>
<style>
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#121212;margin:0;font-family:Arial}
.calc{background:#1e1e1e;border-radius:20px;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,0.5);width:320px}
#pantalla{width:100%;height:80px;background:#2a2a2a;border:none;border-radius:10px;color:white;font-size:35px;text-align:right;padding:10px;margin-bottom:15px;box-sizing:border-box}
.botones{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:70px;border:none;border-radius:10px;font-size:24px;cursor:pointer;background:#333;color:white;transition:0.2s}
button:active{background:#555;transform:scale(0.95)}
.op{background:#ff9500}
.op:active{background:#ffad33}
.igual{background:#0f9d58;grid-column:span 2}
.igual:active{background:#14c56f}
.clear{background:#d32f2f}
.clear:active{background:#f44336}
.cero{grid-column:span 2}
</style>
</head>
<body>
<div class="calc">
<input type="text" id="pantalla" readonly>
<div class="botones">
<button class="clear" onclick="limpiar()">C</button>
<button class="op" onclick="agregar('/')">÷</button>
<button class="op" onclick="agregar('*')">×</button>
<button class="op" onclick="borrar()">⌫</button>

<button onclick="agregar('7')">7</button>
<button onclick="agregar('8')">8</button>
<button onclick="agregar('9')">9</button>
<button class="op" onclick="agregar('-')">-</button>

<button onclick="agregar('4')">4</button>
<button onclick="agregar('5')">5</button>
<button onclick="agregar('6')">6</button>
<button class="op" onclick="agregar('+')">+</button>

<button onclick="agregar('1')">1</button>
<button onclick="agregar('2')">2</button>
<button onclick="agregar('3')">3</button>
<button class="igual" onclick="calcular()" rowspan="2">=</button>

<button class="cero" onclick="agregar('0')">0</button>
